  <g fill="#D3D7DE">
    <rect x="20" y="20" width="160" height="100" rx="3"/>
    <rect x="210" y="20" width="140" height="100" rx="3"/>
    <rect x="380" y="20" width="160" height="100" rx="3"/>
    <rect x="20" y="180" width="160" height="100" rx="3"/>
    <rect x="380" y="180" width="160" height="100" rx="3"/>
