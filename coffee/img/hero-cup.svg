<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360">
  <!-- Иллюстрация для первого экрана: чашка капучино на блюдце -->
  <defs>
    <linearGradient id="cup" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFBF6"/>
      <stop offset=".7" stop-color="#F3E9DC"/>
      <stop offset="1" stop-color="#E2D2BF"/>
    </linearGradient>
    <radialGradient id="crema" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#B9814F"/>
      <stop offset="1" stop-color="#6E4122"/>
    </radialGradient>
  </defs>

  <!-- Тень и блюдце -->
  <ellipse cx="210" cy="332" rx="180" ry="22" fill="#3B2A20" opacity=".15"/>
  <ellipse cx="210" cy="318" rx="172" ry="30" fill="#FFFBF6"/>
  <ellipse cx="210" cy="314" rx="120" ry="18" fill="#EDE2D3"/>

  <!-- Ручка -->
  <path d="M312 178c58-6 62 78-10 74" fill="none" stroke="#EDE2D3" stroke-width="20" stroke-linecap="round"/>

  <!-- Корпус чашки -->
  <path d="M98 150h224c0 92-30 152-74 160h-76c-44-8-74-68-74-160z" fill="url(#cup)"/>
  <path d="M120 200c8 50 30 90 60 100" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".7"/>

  <!-- Полоска-декор на чашке -->
  <path d="M104 210c60 14 152 14 212 0" fill="none" stroke="#C8874B" stroke-width="6" opacity=".8"/>

  <!-- Край и кофе с латте-артом -->
  <ellipse cx="210" cy="150" rx="112" ry="24" fill="#F3E9DC"/>
  <ellipse cx="210" cy="152" rx="100" ry="18" fill="url(#crema)"/>
  <path d="M210 166c-22-10-32-16-32-24 0-6 6-9 12-9 8 0 14 5 20 11 6-6 12-11 20-11 6 0 12 3 12 9 0 8-10 14-32 24z" fill="#F6E6D2"/>

  <!-- Кофейные зёрна на блюдце -->
  <g fill="#5A3A26">
    <g transform="translate(70 312) rotate(-25)">
      <ellipse rx="13" ry="9"/>
      <path d="M-11 0c6-3 14 3 22 0" stroke="#2E1E15" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(96 330) rotate(15)">
      <ellipse rx="11" ry="8"/>
      <path d="M-9 0c5-3 12 3 18 0" stroke="#2E1E15" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(350 322) rotate(30)">
      <ellipse rx="12" ry="8.5"/>
      <path d="M-10 0c5-3 13 3 20 0" stroke="#2E1E15" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
