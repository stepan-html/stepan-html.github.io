<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Иллюстрация: фигура в позе «дерева» на фоне солнца и листьев (линейная графика) -->
  <!-- Солнце -->
  <circle cx="200" cy="170" r="92" fill="#F7E3DA"/>
  <circle cx="200" cy="170" r="92" fill="none" stroke="#E8B4A0" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- Листья по бокам -->
  <g fill="#8FA98F" opacity=".85">
    <path d="M40 360c0-40 26-70 66-74 0 40-26 70-66 74z"/>
    <path d="M30 420c10-34 40-52 74-46-10 34-40 52-74 46z" opacity=".7"/>
    <path d="M360 330c-2-38-28-64-66-66 2 38 28 64 66 66z"/>
    <path d="M372 400c-12-30-40-46-70-40 12 30 40 46 70 40z" opacity=".7"/>
  </g>

  <!-- Коврик -->
  <rect x="90" y="452" width="220" height="12" rx="6" fill="#D8C6A4"/>

  <!-- Фигура (поза дерева): голова, руки над головой, корпус, опорная нога, согнутая нога -->
  <g fill="none" stroke="#3D3A36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- руки, соединённые над головой -->
    <path d="M190 196 C 166 170, 170 104, 196 70 M210 196 C 234 170, 230 104, 204 70"/>
    <path d="M196 70 L200 62 L204 70"/>
    <!-- корпус -->
    <path d="M200 182 C 196 230, 196 270, 200 300"/>
    <!-- опорная нога -->
    <path d="M200 300 C 202 360, 204 410, 206 450"/>
    <path d="M206 450 h18"/>
    <!-- согнутая нога: колено в сторону, стопа у бедра -->
    <path d="M200 300 C 230 320, 258 340, 250 362 C 242 380, 214 372, 204 360"/>
  </g>
  <!-- Голова -->
  <circle cx="200" cy="166" r="16" fill="#3D3A36"/>
  <!-- Одежда: топ -->
  <path d="M188 192 C 186 220, 188 246, 192 262 H208 C 212 246, 214 220, 212 192 Z" fill="#8FA98F"/>
</svg>
