<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440">
  <!-- Эмблема для первого экрана: скрещённые опасная бритва и ножницы в круге -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C77F"/>
      <stop offset=".5" stop-color="#C9A04A"/>
      <stop offset="1" stop-color="#8E6C28"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#8B8F93"/>
    </linearGradient>
    <path id="ring" d="M220 220m-165 0a165 165 0 1 1 330 0a165 165 0 1 1-330 0"/>
  </defs>

  <!-- Кольца -->
  <circle cx="220" cy="220" r="210" fill="#161616" stroke="url(#brass)" stroke-width="3"/>
  <circle cx="220" cy="220" r="190" fill="none" stroke="#C9A04A" stroke-width="1" stroke-dasharray="2 8" opacity=".6"/>
  <circle cx="220" cy="220" r="140" fill="#1B1B1B" stroke="#2E2E2E" stroke-width="2"/>

  <!-- Надпись по кругу -->
  <text font-family="Oswald, Arial Narrow, sans-serif" font-size="22" letter-spacing="9" fill="#C9A04A">
    <textPath href="#ring">БАРБЕРШОП · КРЕМЕНЬ · ЛИТЕЙНАЯ 7 · С 2018 ·</textPath>
  </text>

  <!-- Ножницы (повёрнуты) -->
  <g transform="rotate(40 220 220)">
    <path d="M214 120 L222 230 L206 230 Z" fill="url(#steel)"/>
    <path d="M226 120 L234 230 L218 230 Z" fill="url(#steel)" opacity=".85"/>
    <circle cx="220" cy="232" r="5" fill="#C9A04A"/>
    <circle cx="204" cy="282" r="20" fill="none" stroke="url(#brass)" stroke-width="8"/>
    <circle cx="238" cy="282" r="20" fill="none" stroke="url(#brass)" stroke-width="8"/>
    <path d="M212 236 206 262M228 236 234 262" stroke="url(#brass)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Опасная бритва (повёрнута в другую сторону) -->
  <g transform="rotate(-40 220 220)">
    <rect x="208" y="210" width="24" height="120" rx="10" fill="url(#brass)"/>
    <path d="M214 230v80M226 230v80" stroke="#8E6C28" stroke-width="2"/>
    <path d="M210 210 L210 112 Q210 100 222 100 L236 100 L236 210 Z" fill="url(#steel)"/>
    <path d="M236 100 L236 210" stroke="#FFFFFF" stroke-width="2" opacity=".8"/>
    <circle cx="220" cy="214" r="5" fill="#121212"/>
  </g>

  <!-- Звёздочки -->
  <g fill="#C9A04A">
    <circle cx="70" cy="220" r="4"/>
    <circle cx="370" cy="220" r="4"/>
  </g>
</svg>
