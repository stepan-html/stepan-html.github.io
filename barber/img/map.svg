<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300">
  <!-- Тёмная стилизованная карта-заглушка (адрес вымышленный) -->
  <rect width="560" height="300" fill="#191919"/>

  <!-- Кварталы -->
  <g fill="#222">
    <rect x="20" y="20" width="150" height="90" rx="4"/>
    <rect x="200" y="20" width="160" height="90" rx="4"/>
    <rect x="390" y="20" width="150" height="90" rx="4"/>
    <rect x="20" y="180" width="150" height="100" rx="4"/>
    <rect x="390" y="180" width="150" height="100" rx="4"/>
  </g>

  <!-- Улицы -->
  <g fill="#2C2C2C">
    <rect x="0" y="126" width="560" height="38"/>
    <rect x="178" y="0" width="14" height="300"/>
    <rect x="368" y="0" width="14" height="300"/>
  </g>
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="13" fill="#8A847B" letter-spacing="2">ЛИТЕЙНАЯ УЛ.</text>

  <!-- Здание барбершопа -->
  <rect x="200" y="180" width="160" height="100" rx="4" fill="#2E2818" stroke="#C9A04A" stroke-width="2"/>

  <!-- Метка -->
  <g transform="translate(280 196)">
    <path d="M0 44c-16-20-24-32-24-44a24 24 0 0 1 48 0c0 12-8 24-24 44z" fill="#C9A04A"/>
    <circle cx="0" cy="0" r="9" fill="#121212"/>
  </g>
  <text x="280" y="268" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#EAE6DF" text-anchor="middle" letter-spacing="1">ЛИТЕЙНАЯ, 7</text>
</svg>
